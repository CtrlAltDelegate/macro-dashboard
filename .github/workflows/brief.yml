name: macro-brief

# Emails the Macro Brief Mon/Wed/Fri. Cron is UTC: 11:00 UTC = 6 AM EST / 7 AM EDT.
# GitHub may start scheduled runs a few minutes late. Run manually from the Actions tab any time.
on:
  schedule:
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, don't send (the .eml is uploaded as an artifact)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and send brief
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python send_brief.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Upload dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: brief
          path: exports/brief/

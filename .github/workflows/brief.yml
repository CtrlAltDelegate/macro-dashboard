name: macro-brief

# Emails the Macro Brief Mon/Wed/Fri at 5 AM Eastern, year round. Cron is UTC only, so there are two
# triggers (09:00 UTC = 5 AM EDT, 10:00 UTC = 5 AM EST) and the job skips the one that doesn't match
# today's daylight-saving offset. GitHub may start scheduled runs a few minutes late.
# Run manually from the Actions tab any time.
on:
  schedule:
    - cron: "0 9 * * 1,3,5"
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, don't send (the .eml is uploaded as an artifact)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep only the 5 AM Eastern trigger
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)   # -0400 (EDT) or -0500 (EST)
          if [ -z "$SCHEDULE" ] \
             || { [ "$offset" = "-0400" ] && [ "$SCHEDULE" = "0 9 * * 1,3,5" ]; } \
             || { [ "$offset" = "-0500" ] && [ "$SCHEDULE" = "0 10 * * 1,3,5" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: '$SCHEDULE' is not 5 AM Eastern today (offset $offset)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Build and send brief
        if: steps.gate.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python send_brief.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Upload dry-run output
        if: steps.gate.outputs.run == 'true' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: brief
          path: exports/brief/
